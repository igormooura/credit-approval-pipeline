version: '3.8'

services:
  postgres:
    image: postgres
    container_name: credit-approval-sql
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: always

  rabbitmq:
    image: "rabbitmq:3.13-management"
    container_name: credit-approval-rabbitmq
    env_file:
      - .env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  credit_analysis_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit_analysis_container
    env_file:
      - .env
    depends_on:
      - postgres
      - rabbitmq
    command: ["npx", "ts-node", "src/workers/creditAnalysisWorker.ts"]
    restart: always

  limit_calculator_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: limit_calculator_container
    env_file:
      - .env
    depends_on:
      - postgres
      - rabbitmq
    command: ["npx", "ts-node", "src/workers/limitCalculatorWorker.ts"]
    restart: always

  fraud_analysis_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud_analysis_container
    env_file:
      - .env
    depends_on:
      - postgres
      - rabbitmq
    command: ["npx", "ts-node", "src/workers/fraudAnalysisWorker.ts"]
    restart: always

  card_issuer_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: card_issuer_container
    env_file:
      - .env
    depends_on:
      - postgres
      - rabbitmq
    command: ["npx", "ts-node", "src/workers/cardIssuerWorker.ts"]
    restart: always

  marketing_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketing_container
    env_file:
      - .env
    depends_on:
      - postgres
      - rabbitmq
    command: ["npx", "ts-node", "src/workers/marketingWorker.ts"]
    restart: always

  confirmation_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: confirmation_container
    env_file:
      - .env
    depends_on:
      - postgres
      - rabbitmq
    command: ["npx", "ts-node", "src/workers/confirmationWorker.ts"]
    restart: always

volumes:
  postgres-data: